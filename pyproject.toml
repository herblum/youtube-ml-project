[project]
name = "youtube-ml-project"
version = "0.1.0"
description = "youtube ml model for virality prediction"
readme = "README.md"
authors = [
    { email = "herblum@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "kagglehub>=1.0.3",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
youtube-ml-project = "youtube_ml_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
