# fly.toml app configuration file generated for youtube-ml-project on 2026-11-14T11:07:16-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'youtube-ml-project'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
